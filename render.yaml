services:
  - type: web
    name: golf-sales-system
    runtime: node
    plan: starter
    rootDir: sales-system
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /data/sales.db
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
