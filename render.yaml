# Render Blueprint: Growth Note（growth-note/ ディレクトリのアプリ）
# Render ダッシュボード → New → Blueprint でこのリポジトリを選ぶとデプロイされます。
services:
  - type: web
    name: growth-note
    runtime: node
    rootDir: growth-note
    region: singapore        # 日本から近いリージョン
    plan: free               # 無料枠（15分アクセスがないとスリープ、再起動でデータが消える）
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production    # HTTPS 前提で Secure Cookie を有効化
      - key: TRUST_PROXY
        value: "1"
      # 課金の流れを試すためのデモ決済（実際の請求なし）。Stripe を設定したら削除する
      - key: BILLING_DEMO
        value: "1"
      # Stripe を使うときは、ダッシュボードの Environment で次を設定する:
      # STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET / STRIPE_PRICE_MONTHLY / STRIPE_PRICE_YEARLY / APP_URL
      # 販売前に設定するもの（Environment で設定。値は README を参照）:
      # OPERATOR_NAME / OPERATOR_REPRESENTATIVE / OPERATOR_ADDRESS / OPERATOR_PHONE / OPERATOR_EMAIL（特定商取引法の表記）
      # RESEND_API_KEY / MAIL_FROM（パスワード再設定メール）
      # ADMIN_EMAILS（運営ダッシュボード）/ ERROR_WEBHOOK_URL（エラー通知）/ ANTHROPIC_API_KEY（AI）
    # データを残したい場合は、上の plan を starter（有料）にして、次のディスク設定を有効にする
    # disk:
    #   name: growth-note-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # あわせて envVars に DATA_DIR=/var/data を追加
