services:
  - type: web
    name: shadow-golf-karte
    runtime: node
    plan: free
    branch: claude/golf-lesson-ai-system-yb0k0m
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: STUDIO_NAME
        value: GOLF STUDIO SHADOW
      - key: APP_TAGLINE
        value: ゴルフ成長AI記録ノート
      - key: BRAND_COLOR
        value: '#1b6b4f'
      - key: OWNER_NAME
        value: シャドー代表
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
