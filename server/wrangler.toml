name = "ai-golf-coach"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Web 版（GitHub Pages）と iPhone アプリ内の画面を許可
ALLOWED_ORIGINS = "https://onefordream.github.io,aigolf://app"

# 同じ端末（IP）からは 1 分に 6 回まで
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

# API キーは次のコマンドで登録する（ファイルには書かない）
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put APP_KEY
